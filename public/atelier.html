<div class="pagehead"><div><h1 id="title">我的视频</h1><p id="intro"></p></div><button id="refresh">刷新索引</button><a class="primary" id="start" href="/studio/" hidden>＋ 开始制作</a></div>
<p id="notice" role="status"></p>
<section id="gallery" class="workspace"><aside id="categories"><h3>作品分类</h3><div id="cats"></div></aside><article class="panel"><div class="heading"><div><small class="kicker">作品管理</small><h2 id="collection">全部视频</h2></div><button id="catMenu">分类</button><span class="counter" id="total"></span></div><div class="tools"><input id="search" type="search" aria-label="搜索作品" placeholder="搜索作品、商品或任务"><select id="product" aria-label="商品"></select><select id="available" aria-label="文件状态"><option value="">全部状态</option><option value="yes">可用</option><option value="no">缺失</option></select></div><div id="cards" class="cards"></div></article></section>
